site_name: Manual de Convocação de Remanescentes - Compras.gov.br

theme:
  name: readthedocs

markdown_extensions:
  - md_in_html
  - admonition
  - pymdownx.arithmatex:
      generic: true

nav:
  - Início: index.md
  - 1. Acessando uma contratação: 01-acessando-contratacao.md
  - Versão Completa do material: manual-completo.md

extra_css:
  - custom.css
  - css/extra.css

extra_javascript:
  - js/custom.js
  - js/font-size.js
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js
